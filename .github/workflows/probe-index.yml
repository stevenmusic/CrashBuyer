name: Probe index sources

# Temporary diagnostic: can the real S&P 500 index be had back to 2000 on a free
# tier, the way the ETFs now can? Delete once the question is settled.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            name="$1"; shift
            body=$(curl -sS -m 30 -A "$UA" "$@" 2>&1) || true
            bars=$(printf '%s' "$body" | grep -oE '"(t|date|datetime)":"?[0-9]{4}-[0-9]{2}-[0-9]{2}' | wc -l | tr -d ' ')
            oldest=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | head -1)
            newest=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
            if [ "$bars" = "0" ]; then
              printf '%-28s ERR  %s\n' "$name" "$(printf '%s' "$body" | head -c 150 | tr '\n' ' ')"
            else
              printf '%-28s bars=%-6s %s .. %s\n' "$name" "$bars" "${oldest:-?}" "${newest:-?}"
            fi
          }

          echo '=== Tiingo: does the free tier carry index symbols at all? ==='
          T="token=$TIINGO_API_KEY"
          probe tiingo-%5EGSPC  "https://api.tiingo.com/tiingo/daily/%5EGSPC/prices?startDate=2000-01-01&$T"
          probe tiingo-SPX      "https://api.tiingo.com/tiingo/daily/spx/prices?startDate=2000-01-01&$T"
          probe tiingo-GSPC     "https://api.tiingo.com/tiingo/daily/gspc/prices?startDate=2000-01-01&$T"
          probe tiingo-meta     "https://api.tiingo.com/tiingo/daily/%5EGSPC?$T"

          echo
          echo '=== Twelve Data: index symbols, and can a date range beat outputsize? ==='
          A="apikey=$TWELVEDATA_API_KEY"
          probe td-GSPC-5000    "https://api.twelvedata.com/time_series?symbol=GSPC&interval=1day&outputsize=5000&$A"
          probe td-SPX-5000     "https://api.twelvedata.com/time_series?symbol=SPX&interval=1day&outputsize=5000&$A"
          probe td-SPX-early    "https://api.twelvedata.com/time_series?symbol=SPX&interval=1day&start_date=2000-01-01&end_date=2006-12-31&outputsize=5000&$A"
          # Same paging trick on SPY, where the symbol is known to resolve, to
          # separate "free tier ignores date ranges" from "symbol not permitted".
          probe td-SPY-early    "https://api.twelvedata.com/time_series?symbol=SPY&interval=1day&start_date=2000-01-01&end_date=2006-12-31&outputsize=5000&$A"

          echo
          echo '=== FRED: any long daily broad-market series without the S&P licence ==='
          F="file_type=json&observation_start=2000-01-01&api_key=$FRED_API_KEY"
          probe fred-SP500      "https://api.stlouisfed.org/fred/series/observations?series_id=SP500&$F"
          probe fred-WILL5000PR "https://api.stlouisfed.org/fred/series/observations?series_id=WILL5000PR&$F"
          probe fred-NASDAQCOM  "https://api.stlouisfed.org/fred/series/observations?series_id=NASDAQCOM&$F"
          probe fred-DJIA       "https://api.stlouisfed.org/fred/series/observations?series_id=DJIA&$F"
