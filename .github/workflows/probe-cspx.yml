name: Probe CSPX

# Temporary diagnostic: can a London-listed UCITS tracker be had on the free
# tiers the fetcher already uses? Delete once the question is settled.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            name="$1"; shift
            body=$(curl -sS -m 30 -A "$UA" "$@" 2>&1) || true
            bars=$(printf '%s' "$body" | grep -oE '"(t|date|datetime)":"?[0-9]{4}-[0-9]{2}-[0-9]{2}' | wc -l | tr -d ' ')
            oldest=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | head -1)
            newest=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
            if [ "$bars" = "0" ]; then
              printf '%-26s ERR  %s\n' "$name" "$(printf '%s' "$body" | head -c 130 | tr '\n' ' ')"
            else
              printf '%-26s bars=%-6s %s .. %s\n' "$name" "$bars" "${oldest:-?}" "${newest:-?}"
            fi
          }

          T="token=$TIINGO_API_KEY"; A="apikey=$TWELVEDATA_API_KEY"; S='startDate=2000-01-01'

          echo '=== Tiingo: any London or Xetra line? ==='
          for sym in cspx cspx.l cspx-l csp1 sxr8 sxr8.de; do
            probe "tiingo-$sym" "https://api.tiingo.com/tiingo/daily/$sym/prices?$S&$T"
          done

          echo
          echo '=== Twelve Data: exchange-qualified forms ==='
          probe td-CSPX        "https://api.twelvedata.com/time_series?symbol=CSPX&interval=1day&outputsize=20&$A"
          probe td-CSPX-LSE    "https://api.twelvedata.com/time_series?symbol=CSPX&exchange=LSE&interval=1day&outputsize=20&$A"
          probe td-CSPX-XLON   "https://api.twelvedata.com/time_series?symbol=CSPX&mic_code=XLON&interval=1day&outputsize=20&$A"
          probe td-SXR8-XETR   "https://api.twelvedata.com/time_series?symbol=SXR8&mic_code=XETR&interval=1day&outputsize=20&$A"

          echo
          echo '=== stockanalysis.com: does it serve a London quote route? ==='
          probe sa-lon-cspx    'https://stockanalysis.com/quote/lon/CSPX/history/?range=10Y&period=Day'
          probe sa-api-lon     'https://stockanalysis.com/api/symbol/q/lon/cspx/history?range=10Y&period=Day'
          probe sa-s-cspx      'https://stockanalysis.com/api/symbol/s/cspx/history?range=10Y&period=Day'

          echo
          echo '=== stooq (known to serve a robots page from CI, checking anyway) ==='
          probe stooq-cspx-uk  'https://stooq.com/q/d/l/?s=cspx.uk&i=d'

          echo
          echo '=== control: a symbol known to work, to prove the keys are live ==='
          probe tiingo-ivv     "https://api.tiingo.com/tiingo/daily/ivv/prices?startDate=2024-01-01&$T"
