name: Probe data sources

# Temporary diagnostic: how far back each reachable endpoint will go.
# Delete once the history question is settled.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            name="$1"; url="$2"
            body=$(curl -sS -m 30 -A "$UA" "$url" 2>&1) || true
            bars=$(printf '%s' "$body" | grep -o '"t":' | wc -l | tr -d ' ')
            oldest=$(printf '%s' "$body" | grep -o '"t":"[0-9-]*"' | tail -1 | grep -o '[0-9-]*')
            newest=$(printf '%s' "$body" | grep -o '"t":"[0-9-]*"' | head -1 | grep -o '[0-9-]*')
            err=$(printf '%s' "$body" | head -c 60 | tr '\n' ' ')
            if [ "$bars" = "0" ]; then printf '%-26s ERR  %s\n' "$name" "$err"
            else printf '%-26s bars=%-6s %s .. %s\n' "$name" "$bars" "$oldest" "$newest"; fi
          }
          B='https://stockanalysis.com/api/symbol'
          echo '--- SPY range values (ETF, listed 1993) ---'
          for r in 10Y 20Y 30Y 40Y MAX All ALL all; do
            probe "spy-$r" "$B/s/spy/history?range=$r&period=Day"
          done
          probe spy-no-range   "$B/s/spy/history?period=Day"
          probe spy-week-max   "$B/s/spy/history?range=MAX&period=Week"
          probe spy-month-max  "$B/s/spy/history?range=MAX&period=Month"
          echo '--- longer-lived instruments ---'
          probe vfinx-max      "$B/s/vfinx/history?range=MAX&period=Day"
          probe vfinx-40y      "$B/s/vfinx/history?range=40Y&period=Day"
          probe f-vfinx        "$B/f/vfinx/history?range=MAX&period=Day"
          echo '--- index routes, one more time ---'
          probe idx-noparams   "$B/i/spx/history"
          probe idx-period     "$B/i/spx/history?period=Day"
          probe idx-index-type "$B/index/spx/history?range=MAX&period=Day"
          echo '--- Shiller monthly, 1871+ (control) ---'
          curl -sS -m 30 -A "$UA" 'https://raw.githubusercontent.com/datasets/s-and-p-500/main/data/data.csv' -o /tmp/sh.csv || true
          echo "shiller rows=$(wc -l < /tmp/sh.csv) first=$(sed -n 2p /tmp/sh.csv | cut -d, -f1) last=$(tail -1 /tmp/sh.csv | cut -d, -f1)"
