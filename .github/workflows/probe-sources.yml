name: Probe data sources

# Temporary diagnostic: reports which price endpoints answer a GitHub-hosted
# runner. Delete once a working source is settled on.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            name="$1"; shift
            out=$(curl -sS -m 25 -A "$UA" -w '\n__HTTP__%{http_code}' "$@" 2>&1) || true
            code=$(printf '%s' "$out" | tr -d '\n' | sed -n 's/.*__HTTP__\([0-9]*\).*/\1/p')
            head=$(printf '%s' "$out" | head -c 130 | tr '\n' ' ')
            printf '%-22s http=%-5s %s\n' "$name" "${code:-ERR}" "$head"
          }
          # FRED graph CSV: HTTP/2 died mid-stream last time — retry over 1.1.
          probe fred-csv-h2     'https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500'
          probe fred-csv-h11    --http1.1 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500'
          probe fred-csv-h11-c  --http1.1 --compressed 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500'
          probe fred-downloaddata --http1.1 'https://fred.stlouisfed.org/data/SP500.txt'
          # stockanalysis: host answered 400, so the shape was wrong, not blocked.
          probe sa-lower        'https://stockanalysis.com/api/symbol/i/spx/history?range=10Y'
          probe sa-period       'https://stockanalysis.com/api/symbol/i/spx/history?range=10Y&period=Day'
          probe sa-quote        'https://stockanalysis.com/api/symbol/i/spx'
          probe sa-etf-spy      'https://stockanalysis.com/api/symbol/s/spy/history?range=10Y&period=Day'
          # Yahoo's older CSV download path uses a different backend.
          probe yahoo-download  'https://query1.finance.yahoo.com/v7/finance/download/%5EGSPC?period1=1451865600&period2=1786924800&interval=1d&events=history'
          probe stooq-referer   -H 'Referer: https://stooq.com/' 'https://stooq.com/q/d/l/?s=%5Espx&i=d'
