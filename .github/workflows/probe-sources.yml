name: Probe data sources

# Temporary diagnostic: reports which price endpoints answer a GitHub-hosted
# runner. Delete once a working source is settled on.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            name="$1"; url="$2"
            body=$(curl -sS -m 25 -A "$UA" "$url" 2>&1) || true
            bars=$(printf '%s' "$body" | grep -o '"t":' | wc -l | tr -d ' ')
            first=$(printf '%s' "$body" | grep -o '"t":"[0-9-]*"' | head -1)
            last=$(printf '%s' "$body" | grep -o '"t":"[0-9-]*"' | tail -1)
            head=$(printf '%s' "$body" | head -c 90 | tr '\n' ' ')
            printf '%-26s bars=%-6s %s .. %s | %s\n' "$name" "$bars" "${first:-–}" "${last:-–}" "$head"
          }
          B='https://stockanalysis.com/api/symbol'
          probe idx-spx-day     "$B/i/spx/history?range=10Y&period=Day"
          probe idx-spx-bare    "$B/i/spx/history"
          probe idx-spx-noRange "$B/i/spx/history?period=Day"
          probe idx-gspc        "$B/i/gspc/history?range=10Y&period=Day"
          probe idx-inx         "$B/i/.inx/history?range=10Y&period=Day"
          probe idx-us-spx      "$B/i/us-spx/history?range=10Y&period=Day"
          probe idx-sp500       "$B/i/sp500/history?range=10Y&period=Day"
          echo '--- ETF controls (known-good route) ---'
          probe etf-spy-10y     "$B/s/spy/history?range=10Y&period=Day"
          probe etf-spy-max     "$B/s/spy/history?range=MAX&period=Day"
          probe etf-voo         "$B/s/voo/history?range=10Y&period=Day"
