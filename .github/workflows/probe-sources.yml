name: Probe data sources

# Temporary diagnostic: how far back each candidate will go on a free tier,
# measured from a GitHub-hosted runner. Delete once the question is settled.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            name="$1"; shift
            body=$(curl -sS -m 30 -A "$UA" "$@" 2>&1) || true
            # Count bars and find the oldest date, whatever the payload shape.
            bars=$(printf '%s' "$body" | grep -oE '"(t|date|datetime)":"?[0-9]{4}-[0-9]{2}-[0-9]{2}' | wc -l | tr -d ' ')
            oldest=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | head -1)
            newest=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
            if [ "$bars" = "0" ]; then
              printf '%-26s ERR  %s\n' "$name" "$(printf '%s' "$body" | head -c 120 | tr '\n' ' ')"
            else
              printf '%-26s bars=%-6s %s .. %s\n' "$name" "$bars" "${oldest:-?}" "${newest:-?}"
            fi
          }

          echo '=== stockanalysis: does it take explicit dates rather than range? ==='
          B='https://stockanalysis.com/api/symbol/s/spy/history'
          probe sa-range-10Y      "$B?range=10Y&period=Day"
          probe sa-from-2000      "$B?from=2000-01-01&period=Day"
          probe sa-start-2000     "$B?start=2000-01-01&period=Day"
          probe sa-startEnd       "$B?startDate=2000-01-01&endDate=2026-08-14&period=Day"
          probe sa-period-only    "$B?period=Day&range=25Y"
          probe sa-weekly-max     "$B?range=MAX&period=Week"
          probe sa-monthly-max    "$B?range=MAX&period=Month"

          echo
          echo '=== Tiingo (free key: EOD, full history) ==='
          if [ -n "$TIINGO_API_KEY" ]; then
            probe tiingo-spy-2000 "https://api.tiingo.com/tiingo/daily/spy/prices?startDate=2000-01-01&token=$TIINGO_API_KEY"
          else
            probe tiingo-nokey    'https://api.tiingo.com/tiingo/daily/spy/prices?startDate=2000-01-01'
          fi

          echo
          echo '=== Twelve Data (free key: outputsize up to 5000) ==='
          if [ -n "$TWELVEDATA_API_KEY" ]; then
            probe td-spy-5000 "https://api.twelvedata.com/time_series?symbol=SPY&interval=1day&outputsize=5000&apikey=$TWELVEDATA_API_KEY"
          else
            probe td-nokey    'https://api.twelvedata.com/time_series?symbol=SPY&interval=1day&outputsize=5000'
          fi

          echo
          echo '=== other key-less long-history candidates ==='
          probe wsj-spy   'https://www.wsj.com/market-data/quotes/etf/SPY/historical-prices/download?MOD=mw_quote&startDate=01/01/2000&endDate=08/14/2026'
          probe nasdaq-dl 'https://data.nasdaq.com/api/v3/datasets/MULTPL/SP500_REAL_PRICE_MONTH.csv'
          probe fmp-nokey 'https://financialmodelingprep.com/api/v3/historical-price-full/SPY?from=2000-01-01'
