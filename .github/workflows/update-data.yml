name: Update S&P 500 data

on:
  schedule:
    # 23:10 UTC on weekdays — after the 16:00 ET close in both EST and EDT.
    - cron: '10 23 * * 1-5'
  workflow_dispatch:

# Serialise runs so two commits never race for the same branch.
concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest daily closes
        # Optional: set a free FRED_API_KEY secret to get true S&P 500 index
        # levels. Without it the script falls back to the SPY ETF, which needs
        # no key but quotes ~1/10 of the index level.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional but wanted: a free Tiingo key takes the ETFs back to 2000.
          # Without it they fall back to stockanalysis.com's ten-year ceiling.
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          # Only useful with a PAID key: `outputsize=full` is a paid feature, so
          # a free key still returns the last 100 bars and the script falls back.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: node scripts/fetch-sp500.mjs

      - name: Commit if the series changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff` alone cannot see the file on the very first
          # run, when it is still untracked.
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "data: refresh daily closes through $(node -p "require('./data/instruments.json').instruments[0].end")"
          git push origin HEAD:${GITHUB_REF_NAME}
