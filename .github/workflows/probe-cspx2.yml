name: Probe CSPX free routes

# Temporary: inspect the justETF payload shape closely enough to write a parser.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect justETF payload
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          B='https://www.justetf.com/api/etfs/IE00B5BMR087/performance-chart?locale=en&currency=USD&reduceData=false'
          curl -sSL -m 40 -A "$UA" "$B&valuesType=MARKET_VALUE&includeDividends=true&features=DIVIDENDS" -o mv.json
          curl -sSL -m 40 -A "$UA" "$B&valuesType=NET_ASSET_VALUE" -o nav.json
          # Same call for IVV's UCITS-free US sibling is not possible; use SPY's
          # ISIN-less absence as a reminder this route is UCITS-only.
          node -e '
            const fs = require("fs");
            for (const f of ["mv.json","nav.json"]) {
              let j; try { j = JSON.parse(fs.readFileSync(f,"utf8")); } catch (e) { console.log(f,"NOT JSON:",String(e).slice(0,80)); continue; }
              console.log("=====", f, "top-level keys:", Object.keys(j).join(", "));
              for (const k of Object.keys(j)) {
                const v = j[k];
                if (Array.isArray(v)) {
                  console.log(`  ${k}: array len=${v.length}`);
                  console.log("    first:", JSON.stringify(v[0]));
                  console.log("    last :", JSON.stringify(v[v.length-1]));
                  const mid = v[Math.floor(v.length/2)];
                  console.log("    mid  :", JSON.stringify(mid));
                } else {
                  console.log(`  ${k}:`, JSON.stringify(v).slice(0,120));
                }
              }
              // Look for a 2020 covid bar to sanity-check the level.
              const series = Object.values(j).find(Array.isArray);
              if (series) {
                const hit = series.filter(x => String(x.date||"").startsWith("2020-03-2")).slice(0,3);
                console.log("    2020-03-2x sample:", JSON.stringify(hit));
                const y2010 = series.filter(x => String(x.date||"").startsWith("2010-05")).slice(0,2);
                console.log("    2010-05 sample  :", JSON.stringify(y2010));
              }
            }
          '
