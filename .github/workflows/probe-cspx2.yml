name: Probe CSPX free routes

# Temporary: hunt for any key-less or free-tier source of CSPX daily history.
# Delete once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          ISIN=IE00B5BMR087

          look() {
            name="$1"; shift
            body=$(curl -sSL -m 40 -A "$UA" "$@" 2>&1) || true
            n=$(printf '%s' "$body" | wc -c | tr -d ' ')
            dates=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{2}/[A-Za-z]{3}/[0-9]{4}|[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4}' | sort -u | wc -l | tr -d ' ')
            first=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | head -1)
            last=$(printf '%s' "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
            printf '%-30s bytes=%-8s distinct-dates=%-6s %s .. %s | %s\n' \
              "$name" "$n" "$dates" "${first:-?}" "${last:-?}" \
              "$(printf '%s' "$body" | head -c 110 | tr '\n' ' ' | tr -d '\r')"
          }

          echo '=== 1. iShares (the issuer) — discover its own CSV link ==='
          PAGE='https://www.ishares.com/uk/individual/en/products/253743/ishares-sp-500-b-ucits-etf-acc-fund'
          html=$(curl -sSL -m 40 -A "$UA" "$PAGE" 2>&1) || true
          echo "product page bytes: $(printf '%s' "$html" | wc -c)"
          printf '%s' "$html" | grep -oE '/uk/individual/en/products/253743/[^"]*\.ajax\?[^"]*' | sort -u | head -8 \
            | sed 's/&amp;/\&/g' | while read -r path; do
                look "ishares$(printf '%s' "$path" | cut -c1-40)" "https://www.ishares.com${path}"
              done
          echo '--- blind guesses at the usual shapes ---'
          look ishares-csv-fund "https://www.ishares.com/uk/individual/en/products/253743/ishares-sp-500-b-ucits-etf-acc-fund/1506575576011.ajax?fileType=csv&fileName=CSPX_fund&dataType=fund"
          look ishares-csv-nav  "https://www.ishares.com/uk/individual/en/products/253743/ishares-sp-500-b-ucits-etf-acc-fund/1506575576011.ajax?fileType=csv&fileName=CSPX&dataType=nav"

          echo
          echo '=== 2. Boerse Frankfurt public API (no key, Xetra listing, EUR) ==='
          look bf-price-history "https://api.boerse-frankfurt.de/v1/data/price_history?isin=$ISIN&mic=XETR&from=2010-01-01&to=2026-08-19&offset=0&limit=100"
          look bf-quote         "https://api.boerse-frankfurt.de/v1/data/quote_box/single?isin=$ISIN&mic=XETR"

          echo
          echo '=== 3. justETF (UCITS-native, by ISIN) ==='
          look justetf-chart "https://www.justetf.com/api/etfs/$ISIN/performance-chart?locale=en&currency=USD&valuesType=MARKET_VALUE&reduceData=false&includeDividends=true&features=DIVIDENDS"
          look justetf-quote "https://www.justetf.com/api/etfs/$ISIN/quote?locale=en&currency=USD&isin=$ISIN"

          echo
          echo '=== 4. Yahoo (known to 429 across runner IPs — confirming for this symbol) ==='
          look yahoo-cspx-l "https://query1.finance.yahoo.com/v8/finance/chart/CSPX.L?range=max&interval=1d"
          look yahoo-sxr8   "https://query2.finance.yahoo.com/v8/finance/chart/SXR8.DE?range=max&interval=1d"

          echo
          echo '=== 5. stooq variants ==='
          look stooq-cspx-uk "https://stooq.com/q/d/l/?s=cspx.uk&i=d"
          look stooq-sxr8-de "https://stooq.com/q/d/l/?s=sxr8.de&i=d"

          echo
          echo '=== 6. other key-less long shots ==='
          look ft-cspx     'https://markets.ft.com/data/etfs/tearsheet/historical?s=CSPX:LSE:USD'
          look wsj-cspx    'https://www.wsj.com/market-data/quotes/UK/XLON/CSPX/historical-prices/download?startDate=01/01/2010&endDate=08/19/2026'
