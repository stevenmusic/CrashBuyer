  <text x="256" y="232" fill="#f4f1ec" font-family="'DejaVu Sans Mono',monospace"
    font-size="262" font-weight="700" letter-spacing="-14"
    text-anchor="middle" dominant-baseline="central">CB</text>
  <path d="M256 356 L318 434 L194 434 Z" fill="#35b264"/>
</svg>
